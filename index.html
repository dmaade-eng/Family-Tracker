<!DOCTYPE html>
<html lang="en">
<head>
<!--
  FAMILY TRACKER v3
  - Single file. Upload to GitHub as index.html.
  - Firebase config baked in below.
  - Config migrates itself on first load (removes pet + bucket data, hashes PIN).
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Family Tracker</title>

<!-- Home screen / PWA -->
<meta name="theme-color" content="#0f1923">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Tracker">
<link id="appIcon" rel="apple-touch-icon" href="">
<link id="appManifest" rel="manifest" href="">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">

  import { getDatabase, ref, set, get, onValue, update, remove }

  const firebaseConfig = {
    apiKey: "AIzaSyDF7iP4HxN8uHBWXxrd4gUGXcg_Aj4MvyA",
    authDomain: "pocket-money-9dfe8.firebaseapp.com",
    databaseURL: "https://pocket-money-9dfe8-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "pocket-money-9dfe8",
    storageBucket: "pocket-money-9dfe8.firebasestorage.app",
    messagingSenderId: "884874896852",
    appId: "1:884874896852:web:5446da55b9747992686241"

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  window._fbDb = db; window._fbRef = ref; window._fbSet = set;

  window._fbReady = true;
  window.dispatchEvent(new Event('firebase-ready'));
</script>

<style>
:root {
  --bg:       #0f1923;
  --bg2:      #162030;
  --bg3:      #1e2d40;
  --card:     #1a2636;
  --card2:    #243347;
  --border:   rgba(255,255,255,0.08);
  --border2:  rgba(255,255,255,0.15);
  --text:     #f0f4f8;
  --text2:    #8fa8c0;
  --text3:    #546e84;
  --yellow:   #FFD93D;
  --orange:   #FF6B35;
  --pink:     #FF6B9D;
  --teal:     #4ECDC4;
  --blue:     #45B7D1;
  --green:    #6BCB77;
  --purple:   #A78BFA;
  --red:      #FF6B6B;
  --r:        16px;
  --r-sm:     10px;
  --r-lg:     24px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--bg)}
body{font-family:'Nunito',sans-serif;color:var(--text);
  padding-bottom:env(safe-area-inset-bottom);
  background-image:
    radial-gradient(ellipse at 20% 0%,rgba(78,205,196,.08) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 100%,rgba(255,107,53,.06) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 50%,rgba(167,139,250,.04) 0%,transparent 60%);
}

/* CONFETTI */
.confetti-piece{position:fixed;width:10px;height:10px;border-radius:2px;
  pointer-events:none;z-index:9999;animation:confettiFall linear forwards}
@keyframes confettiFall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}

/* TOASTS */
#toastWrap{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:8px;z-index:1200;
  pointer-events:none;padding:0 14px}
.toast{background:var(--card2);border:1px solid var(--border2);border-radius:var(--r);
  padding:12px 16px;font-size:14px;font-weight:700;color:var(--text);
  box-shadow:0 8px 30px rgba(0,0,0,.45);display:flex;align-items:center;gap:12px;
  max-width:460px;width:100%;pointer-events:auto;animation:toastIn .25s ease}
@keyframes toastIn{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast.good{border-color:rgba(107,203,119,.45)}
.toast.warn{border-color:rgba(255,217,61,.45)}
.toast.bad{border-color:rgba(255,107,107,.45)}
.toast-msg{flex:1;line-height:1.35}
.toast-act{background:transparent;border:1px solid var(--border2);border-radius:8px;
  padding:6px 12px;color:var(--yellow);font-family:'Nunito',sans-serif;
  font-size:13px;font-weight:800;cursor:pointer;flex-shrink:0}
.toast-act:hover{background:rgba(255,217,61,.12)}

/* LOADING */
#loading{position:fixed;inset:0;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:9999;gap:20px}
#loading .logo{font-family:'Fredoka One',cursive;font-size:36px;color:var(--yellow);
  animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.spinner{width:40px;height:40px;border:3px solid var(--bg3);
  border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* HEADER */
.header{background:var(--bg2);border-bottom:1px solid var(--border);
  padding:12px 20px;display:flex;align-items:center;
  justify-content:space-between;flex-wrap:wrap;gap:10px;
  position:sticky;top:0;z-index:100}
.logo-text{font-family:'Fredoka One',cursive;font-size:22px;
  background:linear-gradient(135deg,var(--yellow),var(--orange));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text}
.header-right{display:flex;align-items:center;gap:8px}
.week-nav{display:flex;align-items:center;gap:6px;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:4px 10px}
.week-nav button{background:transparent;border:none;color:var(--text2);
  cursor:pointer;font-size:16px;padding:4px 8px;border-radius:6px;transition:color .15s}
.week-nav button:hover{color:var(--text)}
.week-nav button:disabled{opacity:.25;cursor:default}
.week-nav span{font-size:12px;color:var(--text2);min-width:80px;text-align:center}
.lock-btn{display:flex;align-items:center;gap:6px;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:9px 14px;cursor:pointer;
  font-size:13px;color:var(--text2);font-family:'Nunito',sans-serif;
  font-weight:600;transition:all .15s}
.lock-btn:hover{border-color:var(--border2);color:var(--text)}
.lock-btn.unlocked{background:rgba(107,203,119,.15);border-color:rgba(107,203,119,.4);color:var(--green)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text3);
  display:inline-block;margin-right:4px;transition:background .3s}
.sync-dot.ok{background:var(--green)}.sync-dot.err{background:var(--red)}
#syncLabel{font-size:11px;color:var(--text3)}

/* NAV */
.nav{background:var(--bg2);border-bottom:1px solid var(--border);
  display:flex;padding:0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;position:sticky;top:57px;z-index:90}
.nav::-webkit-scrollbar{display:none}
.nav-btn{background:transparent;border:none;border-bottom:3px solid transparent;
  padding:12px 16px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;
  color:var(--text3);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0}
.nav-btn:hover{color:var(--text2)}
.nav-btn.active{color:var(--text);border-bottom-color:var(--yellow)}
.nav-btn .wk-earn{font-size:10px;display:block;margin-top:1px;font-weight:600;color:var(--green)}
.nav-btn.active .wk-earn{color:var(--green)}

/* MAIN */
.main{max-width:920px;margin:0 auto;padding:1.5rem 1.25rem 4rem}

/* BANNERS */
.ro-banner{background:rgba(69,183,209,.12);border:1px solid rgba(69,183,209,.25);
  border-radius:var(--r-sm);padding:9px 14px;font-size:13px;color:var(--blue);
  margin-bottom:1.25rem;display:flex;align-items:center;gap:8px;font-weight:600}
.retro-banner{background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.25);
  border-radius:var(--r-sm);padding:9px 14px;font-size:13px;color:var(--purple);
  margin-bottom:1.25rem;display:flex;align-items:center;gap:8px;font-weight:600}
.sunday-banner{background:rgba(255,217,61,.12);border:1px solid rgba(255,217,61,.3);
  border-radius:var(--r-sm);padding:11px 14px;font-size:13px;color:var(--yellow);
  margin-bottom:1.25rem;display:flex;align-items:center;gap:10px;font-weight:700;flex-wrap:wrap}
.sunday-banner button{margin-left:auto;background:rgba(255,217,61,.18);
  border:1px solid rgba(255,217,61,.4);border-radius:8px;padding:6px 14px;
  color:var(--yellow);font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer}

/* CHILD HERO */
.child-hero{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1.25rem;flex-wrap:wrap;gap:12px}
.child-name-block .cname{font-family:'Fredoka One',cursive;font-size:28px;color:var(--text)}
.child-name-block .csub{font-size:13px;color:var(--text3);margin-top:2px;font-weight:600}
.payout-hero{text-align:right;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:12px 18px;min-width:130px}
.payout-hero .ph-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;
  letter-spacing:.8px;font-weight:700}
.payout-hero .ph-val{font-size:30px;font-weight:800;color:var(--green);
  font-family:'Fredoka One',cursive}

/* MONEY SUMMARY */
.money-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
@media(max-width:560px){.money-summary{grid-template-columns:1fr}}
.msum{border-radius:var(--r);padding:1rem 1.15rem;position:relative}
.msum.earned{background:linear-gradient(135deg,rgba(107,203,119,.15),rgba(107,203,119,.04));
  border:1px solid rgba(107,203,119,.3)}
.msum.received{background:linear-gradient(135deg,rgba(69,183,209,.15),rgba(69,183,209,.04));
  border:1px solid rgba(69,183,209,.3)}
.msum.owed{background:linear-gradient(135deg,rgba(255,217,61,.15),rgba(255,217,61,.04));
  border:1px solid rgba(255,217,61,.3)}
.msum.owed.clear{background:linear-gradient(135deg,rgba(84,110,132,.14),rgba(84,110,132,.04));
  border:1px solid var(--border2)}
.msum-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;
  font-weight:800;margin-bottom:6px}
.msum.earned .msum-lbl{color:var(--green)}
.msum.received .msum-lbl{color:var(--blue)}
.msum.owed .msum-lbl{color:var(--yellow)}
.msum.owed.clear .msum-lbl{color:var(--text3)}
.msum-val{font-family:'Fredoka One',cursive;font-size:30px;color:var(--text);line-height:1.1}
.msum-sub{font-size:12px;color:var(--text3);font-weight:600;margin-top:5px}
.msum-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.msum-btn{flex:1;min-width:110px;padding:11px 14px;border-radius:var(--r-sm);
  border:1px solid var(--border2);background:var(--bg3);color:var(--text);
  font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;
  transition:all .15s}
.msum-btn:hover{border-color:var(--text3)}
.msum-btn.primary{background:linear-gradient(135deg,var(--yellow),var(--orange));
  border:none;color:#1a1a1a;box-shadow:0 4px 18px rgba(255,107,53,.28)}
.msum-btn.primary:hover{transform:translateY(-1px);box-shadow:0 7px 24px rgba(255,107,53,.36)}
.msum-btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}

/* PROGRESS RINGS */
.rings-row{display:flex;gap:16px;margin-bottom:1.5rem;flex-wrap:wrap}
.ring-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:14px;display:flex;flex-direction:column;align-items:center;gap:6px;
  flex:1;min-width:100px}
.ring-wrap{position:relative;width:72px;height:72px}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--bg3);stroke-width:6}
.ring-fill{fill:none;stroke-width:6;stroke-linecap:round;
  transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.ring-pct{font-size:16px;font-weight:800;color:var(--text)}
.ring-sub{font-size:9px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.ring-card-label{font-size:12px;color:var(--text2);font-weight:700;text-align:center}

/* STREAK */
.streak-badge{display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,217,61,.12);border:1px solid rgba(255,217,61,.3);
  border-radius:99px;padding:4px 12px;font-size:13px;font-weight:800;color:var(--yellow)}
.streak-badge.cold{background:var(--bg3);border-color:var(--border);color:var(--text3)}

/* DAYS GRID */
.days-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;
  color:var(--text3);margin-bottom:8px;font-weight:700}
.days-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:1.5rem}
.day-col{background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-sm);overflow:hidden;transition:border-color .2s;
  display:flex;flex-direction:column}
.day-col.today{border-color:var(--teal)}
.day-col.perfect{border-color:var(--green);background:rgba(107,203,119,.08)}
.day-head{background:var(--bg3);padding:7px 3px 5px;text-align:center;
  border-bottom:1px solid var(--border)}
.day-head .dn{font-size:11px;font-weight:800;color:var(--text2)}
.day-head .ds{font-size:9px;font-weight:700;margin-top:1px}
.day-head .ds.pos{color:var(--green)}.day-head .ds.neg{color:var(--red)}
.day-tasks{padding:6px 3px;display:flex;flex-direction:column;align-items:center;
  gap:5px;flex:1}
.tbtn{width:34px;height:34px;border-radius:50%;
  border:2px solid var(--border2);background:transparent;
  cursor:pointer;font-size:14px;font-weight:800;color:var(--text3);
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;touch-action:manipulation;position:relative;flex-shrink:0}
.tbtn:hover{border-color:var(--text2);color:var(--text2)}
.tbtn.done{background:var(--green);border-color:var(--green);color:#fff;
  animation:tickPop .3s cubic-bezier(.34,1.56,.64,1)}
.tbtn.bonus{background:var(--yellow);border-color:var(--yellow);color:#1a1a1a;
  animation:tickPop .3s cubic-bezier(.34,1.56,.64,1)}
.tbtn.pen{background:var(--red);border-color:var(--red);color:#fff;
  animation:tickPop .3s cubic-bezier(.34,1.56,.64,1)}
.tbtn.ro{cursor:default}
.tbtn.ro:hover{border-color:var(--border2);color:var(--text3)}
.tbtn.done.ro{background:var(--green);border-color:var(--green);color:#fff}
.tbtn.bonus.ro{background:var(--yellow);border-color:var(--yellow);color:#1a1a1a}
.tbtn.pen.ro{background:var(--red);border-color:var(--red);color:#fff}
@keyframes tickPop{0%{transform:scale(0.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.tdiv{width:60%;height:1px;background:var(--border);margin:1px 0}

/* ALL DONE BUTTON */
.allday{margin:2px 4px 6px;padding:8px 2px;border-radius:8px;
  border:1px dashed rgba(107,203,119,.4);background:rgba(107,203,119,.08);
  color:var(--green);font-family:'Nunito',sans-serif;font-size:11px;font-weight:800;
  cursor:pointer;transition:all .15s;touch-action:manipulation;line-height:1.1}
.allday:hover{background:rgba(107,203,119,.18)}
.allday.on{background:var(--green);border-style:solid;border-color:var(--green);color:#0f1923}

/* LEGEND */
.legend-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem}
@media(max-width:480px){.legend-grid{grid-template-columns:1fr}}
.lsec h4{font-size:11px;text-transform:uppercase;letter-spacing:.8px;
  color:var(--text3);margin-bottom:7px;font-weight:700}
.lrow{display:flex;align-items:center;gap:8px;padding:7px 10px;
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-sm);margin-bottom:4px}
.lrow.penrow{border-color:rgba(255,107,107,.2);background:rgba(255,107,107,.05)}
.l-icon{font-size:15px;width:20px;text-align:center}
.l-info{flex:1}.l-name{font-size:13px;font-weight:700;color:var(--text)}
.l-desc{font-size:11px;color:var(--text3)}
.l-val{font-size:12px;font-weight:800;min-width:34px;text-align:right}
.l-val.g{color:var(--green)}.l-val.r{color:var(--red)}.l-val.a{color:var(--yellow)}

/* PAYOUT BREAKDOWN */
.payout-card{background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:1.25rem;margin-bottom:1.5rem}
.payout-card h4{font-family:'Fredoka One',cursive;font-size:18px;color:var(--text);margin-bottom:12px}
.pc-row{display:flex;justify-content:space-between;font-size:13px;
  color:var(--text3);padding:6px 0;border-bottom:1px solid var(--border);font-weight:600}
.pc-total{display:flex;justify-content:space-between;font-size:16px;
  font-weight:800;color:var(--text);padding:10px 0 0}

/* PAYMENT LOG */
.pay-log{background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:1.25rem;margin-bottom:1.5rem}
.pay-log h4{font-family:'Fredoka One',cursive;font-size:18px;
  color:var(--text);margin-bottom:12px}
.pl-row{display:flex;align-items:center;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.pl-row:last-child{border:none}
.pl-date{color:var(--text3);font-weight:700;min-width:96px}
.pl-note{flex:1;color:var(--text2);font-weight:600;font-style:italic}
.pl-amt{font-weight:800;color:var(--blue);min-width:70px;text-align:right}
.pl-del{background:transparent;border:none;color:var(--text3);cursor:pointer;
  font-size:15px;padding:4px 8px;border-radius:6px}
.pl-del:hover{color:var(--red);background:rgba(255,107,107,.1)}
.no-history{font-size:13px;color:var(--text3);font-style:italic;padding:8px 0}

/* DASHBOARD */
.dash-title{font-family:'Fredoka One',cursive;font-size:26px;color:var(--text);margin-bottom:.25rem}
.dash-sub{font-size:13px;color:var(--text3);margin-bottom:1.5rem;font-weight:600}
.summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;margin-bottom:1.5rem}
.scard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px}
.scard-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:5px;font-weight:700}
.scard-val{font-size:22px;font-weight:800;color:var(--text)}
.scard-val.g{color:var(--green)}.scard-val.a{color:var(--yellow)}
.scard-val.r{color:var(--red)}.scard-val.b{color:var(--blue)}
.leaderboard{background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:1.25rem;margin-bottom:1.5rem}
.leaderboard h3{font-family:'Fredoka One',cursive;font-size:18px;color:var(--text);margin-bottom:1rem}
.lb-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lb-row:last-child{margin-bottom:0}
.lb-av{width:36px;height:36px;border-radius:50%;background:var(--bg3);
  display:flex;align-items:center;justify-content:center;font-size:13px;
  font-weight:800;color:var(--text);flex-shrink:0;border:2px solid var(--border2)}
.lb-name{font-size:13px;font-weight:800;color:var(--text);min-width:62px}
.lb-track{flex:1;height:10px;background:var(--bg3);border-radius:99px;overflow:hidden}
.lb-fill{height:100%;border-radius:99px;background:var(--green);transition:width .5s ease}
.lb-amt{font-size:13px;font-weight:800;color:var(--green);min-width:60px;text-align:right}
.owed-table{background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:1.25rem;margin-bottom:1.5rem}
.owed-table h3{font-family:'Fredoka One',cursive;font-size:18px;color:var(--text);margin-bottom:1rem}
.ot-row{display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--border);font-size:13px}
.ot-row:last-child{border:none}
.ot-name{font-weight:800;color:var(--text);flex:1}
.ot-fig{font-weight:800;min-width:72px;text-align:right}
.ot-fig.e{color:var(--green)}.ot-fig.r{color:var(--blue)}.ot-fig.o{color:var(--yellow)}
.ot-head{font-size:10px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--text3);font-weight:800}

/* SETTINGS */

<script>
// ═══════════════════════════════════════
//  CONSTANTS & DEFAULTS
// ═══════════════════════════════════════
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const SCHEMA_VERSION = 3;
const IDLE_LOCK_MS  = 10*60*1000;   // auto-lock parent after 10 min idle
const IDLE_WARN_MS  =  9*60*1000;   // warn 1 min before
const CHILD_COLORS = [
  {ring:'#4ECDC4',av:'rgba(78,205,196,.2)',avb:'rgba(78,205,196,.5)'},
  {ring:'#FF6B9D',av:'rgba(255,107,157,.2)',avb:'rgba(255,107,157,.5)'},
  {ring:'#FFD93D',av:'rgba(255,217,61,.2)',avb:'rgba(255,217,61,.5)'},
  {ring:'#A78BFA',av:'rgba(167,139,250,.2)',avb:'rgba(167,139,250,.5)'},
];

const DEFAULT_CONFIG = {
  schemaVersion: SCHEMA_VERSION,
  pinHash: null,          // set on first migration; falls back to '1234'
  children:[
    {id:'c1',name:'Chelsea',base:10,startingEarned:0,startingReceived:0,baselineWeek:null,payments:[]},
    {id:'c2',name:'Troy',   base:10,startingEarned:0,startingReceived:0,baselineWeek:null,payments:[]},
    {id:'c3',name:'Sienna', base:10,startingEarned:0,startingReceived:0,baselineWeek:null,payments:[]},
  ],
  tasks:[
    {id:'t1',name:'Morning routine',   desc:'Up, dressed, bag ready on time', pct:10,type:'core', icon:'☀️'},
    {id:'t2',name:'Homework done',     desc:'Completed before screens',        pct:15,type:'core', icon:'📚'},
    {id:'t3',name:'Tidy room',         desc:'Room tidy before dinner',         pct:10,type:'core', icon:'🏠'},
    {id:'t4',name:'Screen time limits',desc:'Off devices by agreed time',      pct:10,type:'core', icon:'📵'},
    {id:'t5',name:'Kind to siblings',  desc:'No fighting, no drama',           pct:5, type:'core', icon:'🤝'},
    {id:'t6',name:'Extra chore',       desc:'Vacuum, laundry, bins etc',       pct:10,type:'bonus',icon:'⭐'},
    {id:'t7',name:'Helped with dinner',desc:'Set table or helped cook',        pct:8, type:'bonus',icon:'🍽️'},
  ],
  penalties:[
    {id:'p1',name:'Rude or disrespectful',    pct:10,icon:'🚫'},
    {id:'p2',name:'Lied to a parent',          pct:15,icon:'⚡'},
    {id:'p3',name:'Left a mess after warning', pct:5, icon:'🗑️'},
  ],
  bonusCap:20, penaltyCap:20
};

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
let cfg=null, ticks={}, weekOffset=0;
let isParent=false, activeTab='dashboard', activeChild=0;
let pinBuffer='', pendingPayment=null;
let earnedCache=null;           // invalidated on every render
let idleTimer=null, warnTimer=null;
let migrating=false;

// ═══════════════════════════════════════
//  SMALL UTILITIES
// ═══════════════════════════════════════
function money(n){const v=Math.round((n||0)*100)/100;return (v<0?'-S$':'S$')+Math.abs(v).toFixed(2);}
function round2(n){return Math.round((n||0)*100)/100;}
function esc(s){return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

async function sha256Hex(str){
  if(!(window.crypto&&window.crypto.subtle)) return null;   // insecure context, e.g. file://
  const buf=await window.crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function showToast(msg,kind,action){
  const wrap=document.getElementById('toastWrap');
  if(!wrap) return;
  const el=document.createElement('div');
  el.className='toast '+(kind||'');
  const m=document.createElement('div');
  m.className='toast-msg'; m.textContent=msg;
  el.appendChild(m);
  let life=4000;
  if(action){
    life=action.life||12000;
    const b=document.createElement('button');
    b.className='toast-act'; b.textContent=action.label;
    b.onclick=()=>{el.remove();action.fn();};
    el.appendChild(b);
  }
  wrap.appendChild(el);
  setTimeout(()=>el.remove(),life);
}

// ═══════════════════════════════════════
//  HOME SCREEN ICON + MANIFEST
// ═══════════════════════════════════════
function buildAppIcon(){
  try{
    const size=180,c=document.createElement('canvas');
    c.width=size;c.height=size;
    const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,size,size);
    g.addColorStop(0,'#162030');g.addColorStop(1,'#0f1923');
    x.fillStyle=g;x.fillRect(0,0,size,size);
    x.font='108px serif';x.textAlign='center';x.textBaseline='middle';
    x.fillText('🌴',size/2,size/2+6);
    const png=c.toDataURL('image/png');
    const iconLink=document.getElementById('appIcon');
    if(iconLink) iconLink.href=png;
    const manifest={
      name:'Family Tracker',short_name:'Tracker',
      start_url:'.',scope:'.',display:'standalone',
      background_color:'#0f1923',theme_color:'#0f1923',
      icons:[{src:png,sizes:'180x180',type:'image/png',purpose:'any'}]
    };
    const mLink=document.getElementById('appManifest');
    if(mLink) mLink.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));
  }catch(e){/* icon is cosmetic, never block the app */}
}

// ═══════════════════════════════════════
//  FIREBASE
// ═══════════════════════════════════════
function dbRef(p){return window._fbRef(window._fbDb,p)}

function initFirebase(){
  window._fbOnValue(dbRef('config'),async snap=>{
    if(migrating) return;
    const incoming = snap.exists() ? snap.val() : JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    const {config,changed} = await migrateConfig(incoming);
    cfg = config;
    if(changed || !snap.exists()){
      migrating=true;
      try{ await window._fbSet(dbRef('config'),cfg); }catch(e){ console.error(e); }
      migrating=false;
    }
    maybeRender();
  },err=>{console.error('config read failed',err);setSyncStatus('err');});

  window._fbOnValue(dbRef('ticks'),snap=>{
    if(snap.exists()){
      const raw=snap.val(); ticks={};
      Object.keys(raw).forEach(k=>{if(raw[k]===true) ticks[k]=true;});
    } else { ticks={}; }
    maybeRender();
  },err=>{console.error('ticks read failed',err);setSyncStatus('err');});
}

// ── One-time migration from the v2 structure ──
async function migrateConfig(c){
  let changed=false;
  if(!c || typeof c!=='object') return {config:JSON.parse(JSON.stringify(DEFAULT_CONFIG)),changed:true};

  // Pet tasks are gone.
  if(c.petTasks){ delete c.petTasks; changed=true; }

  // Plaintext PIN becomes a SHA-256 hash.
  if(c.pin && !c.pinHash){
    const h=await sha256Hex(String(c.pin));
    if(h){ c.pinHash=h; delete c.pin; changed=true; }
  }
  if(!c.pinHash && !c.pin){
    const h=await sha256Hex('1234');
    if(h){ c.pinHash=h; changed=true; }
  }

  if(!Array.isArray(c.children)) c.children=[];

  // Drop the pet child.
  const before=c.children.length;
  c.children=c.children.filter(ch=>!ch.isPet);
  if(c.children.length!==before) changed=true;

  c.children.forEach((ch,i)=>{
    if(!ch.id){ ch.id='c'+(i+1); changed=true; }
    // Strip bucket-era fields.
    ['buckets','bucketBalances','goals','charityName','isPet'].forEach(k=>{
      if(k in ch){ delete ch[k]; changed=true; }
    });
    if(typeof ch.startingEarned!=='number'){ ch.startingEarned=0; changed=true; }
    if(typeof ch.startingReceived!=='number'){ ch.startingReceived=0; changed=true; }
    // null baseline = count every week on record. Parent draws the line in Settings.
    if(typeof ch.baselineWeek==='undefined'){ ch.baselineWeek=null; changed=true; }
    // Old payday history becomes the payment log.
    if(Array.isArray(ch.paydayHistory)){
      if(!Array.isArray(ch.payments)) ch.payments=[];
      ch.paydayHistory.forEach((p,n)=>{
        ch.payments.push({
          id:'m'+Date.now()+'_'+n,
          ts:new Date().toISOString(),
          amount:round2(p.total||0),
          note:'Imported from old payday log ('+(p.date||'undated')+')'
        });
      });
      delete ch.paydayHistory; changed=true;
    }
    if(!Array.isArray(ch.payments)){ ch.payments=[]; changed=true; }
    if(typeof ch.base!=='number'){ ch.base=10; changed=true; }
  });

  if(!Array.isArray(c.tasks)||!c.tasks.length){ c.tasks=JSON.parse(JSON.stringify(DEFAULT_CONFIG.tasks)); changed=true; }
  if(!Array.isArray(c.penalties)){ c.penalties=JSON.parse(JSON.stringify(DEFAULT_CONFIG.penalties)); changed=true; }
  if(typeof c.bonusCap!=='number'){ c.bonusCap=20; changed=true; }
  if(typeof c.penaltyCap!=='number'){ c.penaltyCap=20; changed=true; }
  if(c.schemaVersion!==SCHEMA_VERSION){ c.schemaVersion=SCHEMA_VERSION; changed=true; }

  return {config:c,changed};
}

function maybeRender(){if(!cfg) return; showApp(); render(); setSyncStatus('ok');}

function setSyncStatus(s){
  const dot=document.getElementById('syncDot'),lbl=document.getElementById('syncLabel');
  if(!dot||!lbl) return;
  if(s==='ok'){dot.className='sync-dot ok';lbl.textContent='live';}
  else if(s==='saving'){dot.className='sync-dot';lbl.textContent='saving…';}
  else{dot.className='sync-dot err';lbl.textContent='offline';}
}

function saveTick(key,val){
  setSyncStatus('saving');
  const r=dbRef('ticks/'+key);
  const op=val?window._fbSet(r,true):window._fbRemove(r);
  return op.then(()=>setSyncStatus('ok')).catch(err=>{
    console.error('write error',err);setSyncStatus('err');
    showToast('Could not save - check your connection','bad');
  });
}

function saveTicksBatch(updates){
  setSyncStatus('saving');
  const payload={};
  Object.keys(updates).forEach(k=>{payload['ticks/'+k]=updates[k]?true:null;});
  return window._fbUpdate(dbRef('/'),payload)
    .then(()=>setSyncStatus('ok'))
    .catch(err=>{
      console.error('batch write error',err);setSyncStatus('err');
      showToast('Could not save - check your connection','bad');
    });
}

function saveConfig(){
  setSyncStatus('saving');
  return window._fbSet(dbRef('config'),cfg)
    .then(()=>setSyncStatus('ok'))
    .catch(()=>{setSyncStatus('err');showToast('Could not save settings','bad');});
}

function showApp(){
  const map={loading:'none',appHeader:'flex',mainNav:'flex',mainContent:'block',pageFooter:'block'};
  Object.keys(map).forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.style.display=map[id];
  });
}

// ═══════════════════════════════════════
//  WEEK HELPERS  (Singapore local time)
// ═══════════════════════════════════════
function mondayOf(offset){
  const now=new Date(),dow=now.getDay()===0?6:now.getDay()-1;
  const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  mon.setDate(mon.getDate()-dow+offset*7);
  return mon;
}
function keyOf(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function getWeekKey(offset){return keyOf(mondayOf(offset));}
function getWeekLabel(offset){
  const mon=mondayOf(offset),sun=new Date(mon);sun.setDate(mon.getDate()+6);
  const f=d=>d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  if(offset===0) return 'This week';
  if(offset===-1) return 'Last week';
  return f(mon)+' - '+f(sun);
}
function getTodayDayIndex(){const d=new Date().getDay(); return d===0?6:d-1;}
function isSunday(){return new Date().getDay()===0;}

function tickKey(ci,wo,day,tid){return getWeekKey(wo)+'_'+ci+'_'+day+'_'+tid;}
function getTick(ci,wo,day,tid){return !!ticks[tickKey(ci,wo,day,tid)];}
function getTickByWeek(ci,wkKey,day,tid){return !!ticks[wkKey+'_'+ci+'_'+day+'_'+tid];}

// ═══════════════════════════════════════
//  TICK ACTIONS
// ═══════════════════════════════════════
function doToggle(ci,wo,day,tid){
  if(!isParent) return;
  const k=tickKey(ci,wo,day,tid),val=!ticks[k];
  if(val){ticks[k]=true;}else{delete ticks[k];}
  saveTick(k,val);
  if(val && isDayPerfect(ci,wo,DAYS.indexOf(day))) spawnConfetti();
  render();
}

// Marks or clears every core task for one day in a single write.
function toggleAllDay(ci,wo,day){
  if(!isParent) return;
  const core=cfg.tasks.filter(t=>t.type==='core');
  if(!core.length) return;
  const allOn=core.every(t=>getTick(ci,wo,day,t.id));
  const target=!allOn;
  const updates={};
  const prev={};
  core.forEach(t=>{
    const k=tickKey(ci,wo,day,t.id);
    prev[k]=!!ticks[k];
    updates[k]=target;
    if(target) ticks[k]=true; else delete ticks[k];
  });
  saveTicksBatch(updates);
  render();
  if(target){
    spawnConfetti();
    showToast(cfg.children[ci].name+' - all core tasks marked for '+day,'good',{
      label:'Undo',
      fn:()=>{
        Object.keys(prev).forEach(k=>{if(prev[k]) ticks[k]=true; else delete ticks[k];});
        saveTicksBatch(prev);
        render();
      }
    });
  } else {
    showToast(day+' cleared for '+cfg.children[ci].name,'warn',{
      label:'Undo',
      fn:()=>{
        Object.keys(prev).forEach(k=>{if(prev[k]) ticks[k]=true; else delete ticks[k];});
        saveTicksBatch(prev);
        render();
      }
    });
  }
}

// ═══════════════════════════════════════
//  CALC ENGINE
//  All money maths runs off a week key, so
//  "this week" and "all time" share one path.
// ═══════════════════════════════════════
function calcDayByWeek(ci,wkKey,dayIdx){
  const ch=cfg.children[ci];
  const daily=ch.base/7,day=DAYS[dayIdx];
  const core=cfg.tasks.filter(t=>t.type==='core');
  const bonus=cfg.tasks.filter(t=>t.type==='bonus');
  const totalCorePct=core.reduce((s,t)=>s+t.pct,0);
  let coreEarned=0,bonusRaw=0,penRaw=0;
  core.forEach(t=>{if(getTickByWeek(ci,wkKey,day,t.id)) coreEarned+=t.pct;});
  bonus.forEach(t=>{if(getTickByWeek(ci,wkKey,day,t.id)) bonusRaw+=t.pct;});
  cfg.penalties.forEach(p=>{if(getTickByWeek(ci,wkKey,day,p.id)) penRaw+=p.pct;});
  const coreMissedPct=totalCorePct-coreEarned;
  const bonusPct=Math.min(bonusRaw,cfg.bonusCap);
  const penPct=Math.min(penRaw,cfg.penaltyCap);
  const net=Math.max(0,daily*(1-coreMissedPct/100+bonusPct/100-penPct/100));
  return{net,daily,coreMissedPct,bonusPct,penPct};
}
function calcDay(ci,wo,dayIdx){return calcDayByWeek(ci,getWeekKey(wo),dayIdx);}

function calcWeekByKey(ci,wkKey){
  const ch=cfg.children[ci];
  let payout=0,penaltyTotal=0,bonusEarned=0,coreMissed=0;
  const daily=ch.base/7;
  DAYS.forEach((_,i)=>{
    const ds=calcDayByWeek(ci,wkKey,i);
    payout+=ds.net;
    penaltyTotal+=ds.penPct/100*daily;
    bonusEarned+=ds.bonusPct/100*daily;
    coreMissed+=ds.coreMissedPct/100*daily;
  });
  return{payout,penaltyTotal,bonusEarned,coreMissed};
}
function calcWeek(ci,wo){return calcWeekByKey(ci,getWeekKey(wo));}

// Which weeks count towards the running total:
// anything from the baseline week onwards that has at least one tick,
// plus the current week so the figure moves live.
function trackedWeeks(ci){
  const ch=cfg.children[ci];
  const baseline=ch.baselineWeek||'0000-00-00';
  const current=getWeekKey(0);
  const set=new Set();
  Object.keys(ticks).forEach(k=>{
    const parts=k.split('_');
    if(parts.length<4) return;
    if(parts[1]!==String(ci)) return;
    if(parts[0]>=baseline) set.add(parts[0]);
  });
  if(current>=baseline) set.add(current);
  return Array.from(set).sort();
}

function calcEarned(ci){
  if(earnedCache && earnedCache[ci]!==undefined) return earnedCache[ci];
  const ch=cfg.children[ci];
  let total=ch.startingEarned||0;
  trackedWeeks(ci).forEach(wk=>{ total+=calcWeekByKey(ci,wk).payout; });
  total=round2(total);
  if(earnedCache) earnedCache[ci]=total;
  return total;
}
function calcReceived(ci){
  const ch=cfg.children[ci];
  const paid=(ch.payments||[]).reduce((s,p)=>s+(p.amount||0),0);
  return round2((ch.startingReceived||0)+paid);
}
function calcOutstanding(ci){return round2(calcEarned(ci)-calcReceived(ci));}

function calcStreak(ci){
  let streak=0;
  const today=getTodayDayIndex();
  const coreTasks=cfg.tasks.filter(t=>t.type==='core');
  if(!coreTasks.length) return 0;
  for(let wo=0;wo>=-8;wo--){
    const maxDay=wo===0?today-1:6;
    for(let di=maxDay;di>=0;di--){
      const day=DAYS[di];
      if(coreTasks.every(t=>getTick(ci,wo,day,t.id))) streak++;
      else return streak;
    }
  }
  return streak;
}

function calcWeekPct(ci,wo){
  const core=cfg.tasks.filter(t=>t.type==='core');
  let done=0,total=core.length*7;
  DAYS.forEach(day=>core.forEach(t=>{if(getTick(ci,wo,day,t.id)) done++;}));
  return total>0?Math.round(done/total*100):0;
}

function isDayPerfect(ci,wo,dayIdx){
  const core=cfg.tasks.filter(t=>t.type==='core');
  if(!core.length) return false;
  return core.every(t=>getTick(ci,wo,DAYS[dayIdx],t.id));
}

function openPayModal(ci){
  if(!isParent) return;
  const ch=cfg.children[ci];
  const owed=Math.max(0,calcOutstanding(ci));
  pendingPayment={ci};
  document.getElementById('payChildName').textContent='Paying '+ch.name;
  document.getElementById('payOwed').textContent=money(owed);
  document.getElementById('payAmount').value=owed.toFixed(2);
  document.getElementById('payNote').value='';
  document.getElementById('quickFill').innerHTML=
    '<button class="qf-btn" onclick="fillPay('+owed.toFixed(2)+')">Full '+money(owed)+'</button>'+
    '<button class="qf-btn" onclick="fillPay('+(owed/2).toFixed(2)+')">Half</button>'+
    '<button class="qf-btn" onclick="fillPay(0)">Clear</button>';
  document.getElementById('payModal').style.display='flex';
}
function fillPay(v){document.getElementById('payAmount').value=Number(v).toFixed(2);}
function closePayModal(){document.getElementById('payModal').style.display='none';pendingPayment=null;}

function confirmPayment(){
  if(!pendingPayment) return;
  const ci=pendingPayment.ci,ch=cfg.children[ci];
  const amt=round2(parseFloat(document.getElementById('payAmount').value)||0);
  const note=document.getElementById('payNote').value.trim();
  if(amt<=0){showToast('Enter an amount greater than zero','warn');return;}
  if(!Array.isArray(ch.payments)) ch.payments=[];
  ch.payments.unshift({
    id:'m'+Date.now(),
    ts:new Date().toISOString(),
    amount:amt,
    note:note
  });
  earnedCache=null;
  saveConfig();
  closePayModal();
  render();
  const nowOwed=calcOutstanding(ci);
  if(nowOwed<=0.005){
    spawnConfetti(70);
    showToast(ch.name+' is all squared up - nothing outstanding','good');
  } else {
    showToast('Recorded '+money(amt)+' to '+ch.name+'. Still owed: '+money(nowOwed),'good');
  }
}

function deletePayment(ci,pid){
  const ch=cfg.children[ci];
  const p=(ch.payments||[]).find(x=>x.id===pid);
  if(!p) return;
  if(!confirm('Remove this '+money(p.amount)+' payment from the log?')) return;
  ch.payments=ch.payments.filter(x=>x.id!==pid);
  saveConfig(); render();
  showToast('Payment removed','warn',{label:'Undo',fn:()=>{
    cfg.children[ci].payments.unshift(p);
    cfg.children[ci].payments.sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
    saveConfig(); render();
  }});
}

// ═══════════════════════════════════════
//  PIN + AUTO-LOCK
// ═══════════════════════════════════════
function handleLockBtn(){
  if(isParent){lockParent(true);}
  else openPin();
}
function openPin(){
  pinBuffer='';
  document.getElementById('pinError').textContent='';
  updatePinDots();
  document.getElementById('pinModal').style.display='flex';
}
function closePin(){document.getElementById('pinModal').style.display='none';pinBuffer='';}
function handleBackdropClick(e){if(e.target.id==='pinModal') closePin();}
function pinKey(k){
  if(k==='del') pinBuffer=pinBuffer.slice(0,-1);
  else if(k==='clr') pinBuffer='';
  else if(pinBuffer.length<4) pinBuffer+=k;
  updatePinDots();
  document.getElementById('pinError').textContent='';
  if(pinBuffer.length===4) checkPin();
}
function updatePinDots(){
  for(let i=0;i<4;i++){
    const d=document.getElementById('pd'+i);
    if(d) d.classList.toggle('filled',i<pinBuffer.length);
  }
}
async function checkPin(){
  const entered=pinBuffer;
  let ok=false;
  if(cfg.pinHash){
    const h=await sha256Hex(entered);
    ok = h ? h===cfg.pinHash : entered==='1234';   // insecure context fallback
  } else {
    ok = entered===(cfg.pin||'1234');
  }
  if(ok){
    isParent=true; closePin(); updateLockUI(); resetIdle(); render();
    showToast('Parent access unlocked','good');
  } else {
    document.getElementById('pinError').textContent='Incorrect PIN';
    pinBuffer=''; updatePinDots();
    const m=document.querySelector('#pinModal .modal');
    if(m){m.style.animation='shake .3s ease';setTimeout(()=>{m.style.animation='';},300);}
  }
}
function updateLockUI(){
  const btn=document.getElementById('lockBtn');
  const icon=document.getElementById('lockIcon');
  const txt=document.getElementById('lockText');
  if(!btn) return;
  if(isParent){btn.classList.add('unlocked');icon.textContent='🔓';if(txt) txt.textContent='Parent';}
  else{btn.classList.remove('unlocked');icon.textContent='🔒';if(txt) txt.textContent='Login';}
}
function lockParent(manual){
  isParent=false;
  clearTimeout(idleTimer);clearTimeout(warnTimer);
  if(activeTab==='settings') activeTab='dashboard';
  updateLockUI(); render();
  showToast(manual?'Locked':'Parent access locked after 10 minutes idle','warn');
}
function resetIdle(){
  clearTimeout(idleTimer);clearTimeout(warnTimer);
  if(!isParent) return;
  warnTimer=setTimeout(()=>{
    showToast('Parent access locks in 1 minute','warn',{
      label:'Stay unlocked',fn:resetIdle,life:60000
    });
  },IDLE_WARN_MS);
  idleTimer=setTimeout(()=>lockParent(false),IDLE_LOCK_MS);
}
['click','keydown','touchstart','scroll'].forEach(ev=>{
  window.addEventListener(ev,()=>{if(isParent) resetIdle();},{passive:true});
});

function render(){
  if(!cfg) return;

  document.getElementById('weekLabel').textContent=getWeekLabel(weekOffset);

  renderNav(); renderContent();
}

function renderNav(){
  let html='<button class="nav-btn'+(activeTab==='dashboard'?' active':'')+'" onclick="setTab(\'dashboard\')">Dashboard</button>';
  cfg.children.forEach((ch,i)=>{
    const owed=calcOutstanding(i);

}

    '<div class="scard"><div class="scard-lbl">Penalties this week</div><div class="scard-val r">-'+money(totalPen)+'</div></div>'+

}

function tickBtn(ci,wo,day,t,cls,glyph,ro){
  const on=getTick(ci,wo,day,t.id);
  const handler=ro?'':' onclick="doToggle('+ci+','+wo+',\''+day+'\',\''+t.id+'\')"';
  return '<button class="tbtn'+(on?' '+cls:'')+(ro?' ro':'')+'" title="'+esc(t.name)+'"'+handler+'>'+(on?glyph:'')+'</button>';
}

// ── MONEY SUMMARY ──
function renderMoneySummary(ci,ch,ro){
  const earned=calcEarned(ci),received=calcReceived(ci),owed=calcOutstanding(ci);
  const weeks=trackedWeeks(ci).length;
  const clear=owed<=0.005;
  const credit=owed<-0.005;
  const actions=ro?'':
    '<div class="msum-actions">'+
      '<button class="msum-btn primary" onclick="openPayModal('+ci+')"'+(clear?' disabled':'')+'>'+
        (clear?'Nothing to pay':'💵 Record a payment')+'</button>'+
      '<button class="msum-btn" onclick="setTab(\'settings\')">Adjust opening balances</button>'+
    '</div>';

  return '<div class="money-summary">'+
    '<div class="msum earned"><div class="msum-lbl">Pocket money earned</div>'+
      '<div class="msum-val">'+money(earned)+'</div>'+
      '<div class="msum-sub">Opening '+money(ch.startingEarned||0)+' plus '+weeks+' week'+(weeks!==1?'s':'')+' tracked</div></div>'+
    '<div class="msum received"><div class="msum-lbl">Pocket money received</div>'+
      '<div class="msum-val">'+money(received)+'</div>'+
      '<div class="msum-sub">Opening '+money(ch.startingReceived||0)+' plus '+((ch.payments||[]).length)+' payment'+((ch.payments||[]).length!==1?'s':'')+'</div></div>'+
    '<div class="msum owed'+(clear?' clear':'')+'"><div class="msum-lbl">'+(credit?'Paid in advance':'Still to receive')+'</div>'+
      '<div class="msum-val">'+money(credit?-owed:owed)+'</div>'+
      '<div class="msum-sub">'+(credit?'Received more than earned so far':(clear?'All squared up':'Earned minus received'))+'</div></div>'+
  '</div>'+actions;
}

// ── PAYMENT LOG ──
function renderPaymentLog(ci,ch,ro){
  const list=(ch.payments||[]).slice().sort((a,b)=>(b.ts||'').localeCompare(a.ts||''));
  if(!list.length) return '<div class="pay-log"><h4>📅 Payment log</h4><div class="no-history">No payments recorded yet</div></div>';
  return '<div class="pay-log"><h4>📅 Payment log</h4>'+
    list.slice(0,15).map(p=>{
      const d=p.ts?new Date(p.ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'undated';
      return '<div class="pl-row">'+
        '<div class="pl-date">'+d+'</div>'+
        '<div class="pl-note">'+esc(p.note||'')+'</div>'+
        '<div class="pl-amt">'+money(p.amount)+'</div>'+
        (ro?'':'<button class="pl-del" onclick="deletePayment('+ci+',\''+p.id+'\')" title="Remove">✕</button>')+
      '</div>';
    }).join('')+
    (list.length>15?'<div class="no-history">Showing the 15 most recent of '+list.length+'</div>':'')+
  '</div>';
}

// ── SETTINGS ──
function renderSettings(){
  if(!isParent) return '<p style="color:var(--text3);font-size:14px;font-weight:600">Log in as parent to access settings.</p>';
  const c=cfg;
  const coreTotal=c.tasks.filter(t=>t.type==='core').reduce((s,t)=>s+t.pct,0);
  const maxKept=(c.children[0]?c.children[0].base:0)*Math.max(0,(100-coreTotal))/100;

  const opening=c.children.map((ch,i)=>
    '<div class="s-child-head">'+esc(ch.name)+'</div>'+
    '<div class="s-row"><label>Opening earned (S$)</label>'+
      '<input type="number" step="0.01" value="'+(ch.startingEarned||0)+'" onchange="updOpening('+i+',\'startingEarned\',this.value)"></div>'+
    '<div class="s-row"><label>Opening received (S$)</label>'+
      '<input type="number" step="0.01" value="'+(ch.startingReceived||0)+'" onchange="updOpening('+i+',\'startingReceived\',this.value)"></div>'+
    '<div class="s-row"><label>Counting weeks from</label>'+
      '<span class="pct-pill">'+(ch.baselineWeek||'All history')+'</span>'+
      '<button class="save-btn" onclick="resetBaseline('+i+')">Set to this week</button>'+
      (ch.baselineWeek?'<button class="save-btn" onclick="clearBaseline('+i+')">Use all history</button>':'')+'</div>'+
    '<div class="s-row" style="background:transparent;border:none;padding:4px 0">'+
      '<label style="color:var(--text3);font-size:12px;font-weight:600">Currently: earned '+money(calcEarned(i))+
      ' · received '+money(calcReceived(i))+' · owed '+money(calcOutstanding(i))+'</label></div>'
  ).join('');

  return '<div class="s-section"><h3>Opening balances</h3>'+
    '<div class="s-note">Set what each child had earned and received before the app started counting. '+
    'Weeks from the baseline date onwards are added on top, so nothing gets double counted.</div>'+
    opening+
  '</div>'+
  '<div class="s-section"><h3>Children &amp; weekly base</h3>'+
    c.children.map((ch,i)=>'<div class="s-row">'+
      '<label>Name</label>'+
      '<input type="text" value="'+esc(ch.name)+'" onchange="updChildName('+i+',this.value)">'+
      '<span style="font-size:12px;color:var(--text3);font-weight:700">S$</span>'+
      '<input type="number" min="0" step="1" value="'+ch.base+'" onchange="updChildBase('+i+',this.value)">'+
    '</div>').join('')+
  '</div>'+
  '<div class="s-section"><h3>Core task weights</h3>'+
    '<div class="s-note">% deducted from the daily budget for each day missed. '+
    'These currently total <b style="color:'+(coreTotal===100?'var(--green)':'var(--yellow)')+'">'+coreTotal+'%</b>, '+
    'so a child who does nothing all week still keeps '+money(maxKept)+' of their '+money(c.children[0]?c.children[0].base:0)+' base. '+
    'Raise the weights towards 100% to put more at stake.</div>'+
    c.tasks.filter(t=>t.type==='core').map(t=>{
      const idx=c.tasks.findIndex(x=>x.id===t.id);
      return '<div class="s-row"><label>'+t.icon+' '+esc(t.name)+'</label><input type="number" min="0" max="100" step="1" value="'+t.pct+'" onchange="updTaskPct('+idx+',this.value)"><span class="pct-pill">'+t.pct+'%</span></div>';
    }).join('')+
  '</div>'+
  '<div class="s-section"><h3>Bonus task weights</h3>'+
    '<div class="s-note">Capped at <input type="number" min="0" max="100" step="5" value="'+c.bonusCap+'" style="width:56px;font-size:12px;padding:5px 7px;border:1px solid var(--border2);border-radius:6px;background:var(--bg3);color:var(--text)" onchange="updBonusCap(this.value)">% of the daily budget per day.</div>'+
    c.tasks.filter(t=>t.type==='bonus').map(t=>{
      const idx=c.tasks.findIndex(x=>x.id===t.id);
      return '<div class="s-row"><label>'+t.icon+' '+esc(t.name)+'</label><input type="number" min="0" max="100" step="1" value="'+t.pct+'" onchange="updTaskPct('+idx+',this.value)"><span class="pct-pill">'+t.pct+'%</span></div>';
    }).join('')+
  '</div>'+
  '<div class="s-section"><h3>Penalty box</h3>'+
    '<div class="s-note">Capped at <input type="number" min="0" max="100" step="5" value="'+c.penaltyCap+'" style="width:56px;font-size:12px;padding:5px 7px;border:1px solid var(--border2);border-radius:6px;background:var(--bg3);color:var(--text)" onchange="updPenaltyCap(this.value)">% per day.</div>'+
    c.penalties.map((p,i)=>'<div class="s-row" style="border-color:rgba(255,107,107,.2)"><label>'+p.icon+' '+esc(p.name)+'</label><input type="number" min="0" max="100" step="1" value="'+p.pct+'" onchange="updPenPct('+i+',this.value)"><span class="pct-pill r">'+p.pct+'%</span></div>').join('')+
  '</div>'+
  '<div class="s-section"><h3>Parent PIN</h3>'+
    '<div class="s-note">Stored as a SHA-256 hash, so the PIN itself is never written to the database.</div>'+
    '<div class="s-row">'+
      '<label>New PIN</label>'+
      '<input type="password" id="newPinInput" maxlength="4" inputmode="numeric" placeholder="4 digits" style="width:110px;letter-spacing:6px;font-size:16px">'+
      '<button class="save-btn" onclick="savePin()">Save</button>'+
    '</div>'+
    '<div id="pinSaveMsg" style="font-size:12px;color:var(--green);margin-top:4px;min-height:16px;font-weight:700"></div>'+
  '</div>'+
  '<div class="s-section"><h3>Data</h3>'+
    '<div class="s-row" style="border-color:rgba(255,107,107,.2)">'+
      '<label style="color:var(--red)">Reset all tick data</label>'+
      '<button class="danger-btn" onclick="resetTicks()">Reset</button>'+
    '</div>'+
    '<div class="s-note" style="margin-top:8px">Payment logs and opening balances are not affected by this reset.</div>'+
  '</div>';
}

// ── Settings handlers ──
function updChildName(i,v){const n=String(v||'').trim();if(!n) return;cfg.children[i].name=n;saveConfig();render();}
function updChildBase(i,v){cfg.children[i].base=Math.max(0,parseFloat(v)||0);earnedCache=null;saveConfig();render();}
function updTaskPct(i,v){cfg.tasks[i].pct=Math.max(0,parseInt(v)||0);earnedCache=null;saveConfig();render();}
function updPenPct(i,v){cfg.penalties[i].pct=Math.max(0,parseInt(v)||0);earnedCache=null;saveConfig();render();}
function updBonusCap(v){cfg.bonusCap=Math.max(0,parseInt(v)||0);earnedCache=null;saveConfig();render();}
function updPenaltyCap(v){cfg.penaltyCap=Math.max(0,parseInt(v)||0);earnedCache=null;saveConfig();render();}
function updOpening(i,field,v){
  cfg.children[i][field]=round2(parseFloat(v)||0);
  earnedCache=null;saveConfig();render();
  showToast(cfg.children[i].name+' opening balance updated','good');
}
function clearBaseline(i){
  cfg.children[i].baselineWeek=null;
  earnedCache=null;saveConfig();render();
  showToast('Now counting every week on record','good');
}
function resetBaseline(i){
  const wk=getWeekKey(0);
  if(!confirm('Start counting weeks from '+wk+'?\n\nWeeks before that stop counting, so put their historical total into Opening earned.')) return;
  cfg.children[i].baselineWeek=wk;
  earnedCache=null;saveConfig();render();
  showToast('Baseline set to '+wk,'good');
}
async function savePin(){
  const el=document.getElementById('newPinInput');
  const msg=document.getElementById('pinSaveMsg');
  const v=(el.value||'').trim();
  if(!/^\d{4}$/.test(v)){msg.style.color='var(--red)';msg.textContent='Must be exactly 4 digits';return;}
  const h=await sha256Hex(v);
  if(!h){msg.style.color='var(--red)';msg.textContent='Hashing unavailable here - open the site over https';return;}
  cfg.pinHash=h; delete cfg.pin;
  await saveConfig();
  el.value='';
  msg.style.color='var(--green)';msg.textContent='PIN updated ✓';
  setTimeout(()=>{const e2=document.getElementById('pinSaveMsg');if(e2) e2.textContent='';},3000);
}
function resetTicks(){
  if(!confirm('Reset ALL tick data for every child? Payment logs and opening balances are kept.')) return;
  ticks={};
  window._fbRemove(dbRef('ticks'))
    .then(()=>{setSyncStatus('ok');render();showToast('All tick data cleared','warn');})
    .catch(()=>{setSyncStatus('err');showToast('Could not clear tick data','bad');});
}

// ═══════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════
document.getElementById('prevWeek').addEventListener('click',()=>{weekOffset--;render();});
document.getElementById('nextWeek').addEventListener('click',()=>{if(weekOffset<0){weekOffset++;render();}});

buildAppIcon();

if(window._fbReady){initFirebase();}
else{
  window.addEventListener('firebase-ready',initFirebase);
  setTimeout(()=>{
    if(!cfg){
      const l=document.getElementById('loading');
      if(l) l.innerHTML=
      '<div style="text-align:center;padding:2rem;max-width:380px">'+
        '<div style="font-size:32px;margin-bottom:1rem">⚙️</div>'+
        '<h2 style="font-family:\'Fredoka One\',cursive;color:var(--yellow);margin-bottom:.75rem">Cannot reach Firebase</h2>'+
        '<p style="font-size:13px;color:var(--text3);line-height:1.7;font-weight:600">'+
          'Check your connection, or confirm the API key is still allowed for this domain in Google Cloud Console.'+
        '</p>'+
      '</div>';
    }
  },5000);
}
</script>
